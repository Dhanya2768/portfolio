<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFD" />
      <stop offset="100%" stop-color="#F3F0FF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D4AFF" />
      <stop offset="100%" stop-color="#9065FF" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#bgGrad)" />

  <!-- Outer & Inner Borders -->
  <rect x="30" y="30" width="940" height="640" rx="12" fill="none" stroke="#6D4AFF" stroke-width="3" stroke-opacity="0.8" />
  <rect x="42" y="42" width="916" height="616" rx="8" fill="none" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Corner Ornaments -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#6D4AFF" stroke-width="4" stroke-linecap="round" />
  <path d="M 950 80 L 950 50 L 920 50" fill="none" stroke="#6D4AFF" stroke-width="4" stroke-linecap="round" />
  <path d="M 50 620 L 50 650 L 80 650" fill="none" stroke="#6D4AFF" stroke-width="4" stroke-linecap="round" />
  <path d="M 950 620 L 950 650 L 920 650" fill="none" stroke="#6D4AFF" stroke-width="4" stroke-linecap="round" />

  <!-- Top Badge / Header -->
  <g transform="translate(500, 110)">
    <circle cx="0" cy="0" r="32" fill="#EDE9FE" />
    <path d="M -12 -12 L 0 -22 L 12 -12 L 12 14 L -12 14 Z" fill="none" stroke="#6D4AFF" stroke-width="2.5" stroke-linejoin="round" />
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#6D4AFF" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <text x="500" y="175" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#6D4AFF" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
  
  <text x="500" y="215" font-family="'Inter', sans-serif" font-size="14" font-style="italic" fill="#64748B" text-anchor="middle">This is proudly presented to</text>

  <!-- Candidate Name -->
  <text x="500" y="280" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="700" letter-spacing="1.5" fill="#0F172A" text-anchor="middle">DHANYA BIJU</text>
  <line x1="320" y1="300" x2="680" y2="300" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />

  <!-- Course description -->
  <text x="500" y="340" font-family="'Inter', sans-serif" font-size="14" fill="#475569" text-anchor="middle">for successfully completing the technical curriculum and practical assessments in</text>

  <text x="500" y="388" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#4338CA" text-anchor="middle">Python Programming Course</text>

  <!-- Competencies -->
  <text x="500" y="428" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Core Syntax • Object-Oriented Programming (OOP) • Data Structures • Application Logic</text>

  <!-- Institution -->
  <text x="500" y="475" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#1E293B" text-anchor="middle">Avodha Edutech</text>

  <!-- Seal and Signatures -->
  <g transform="translate(500, 560)">
    <!-- Seal -->
    <circle cx="0" cy="0" r="42" fill="url(#sealGrad)" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="#DDD6FE" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M -15 15 L 0 -15 L 15 15 Z" fill="#F5F3FF" opacity="0.9" />
    <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#EDE9FE" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(240, 565)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#94A3B8" stroke-width="1.5" />
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Course Instructor</text>
    <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Avodha Training Division</text>
  </g>

  <g transform="translate(760, 565)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#94A3B8" stroke-width="1.5" />
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Academic Director</text>
    <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Certification Authority</text>
  </g>

  <!-- Certificate ID Footer -->
  <text x="500" y="640" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Credential ID: AVODHA-PY-2024 • Academic &amp; Technical Verification</text>
</svg>

