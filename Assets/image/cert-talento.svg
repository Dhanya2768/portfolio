<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bgGradTalento" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFDFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="sealGradTalento" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#bgGradTalento)" />

  <!-- Outer & Inner Borders -->
  <rect x="30" y="30" width="940" height="640" rx="12" fill="none" stroke="#2563EB" stroke-width="3" stroke-opacity="0.8" />
  <rect x="42" y="42" width="916" height="616" rx="8" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Corner Ornaments -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />
  <path d="M 950 80 L 950 50 L 920 50" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />
  <path d="M 50 620 L 50 650 L 80 650" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />
  <path d="M 950 620 L 950 650 L 920 650" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />

  <!-- Top Badge / Header -->
  <g transform="translate(500, 110)">
    <circle cx="0" cy="0" r="32" fill="#DBEAFE" />
    <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="#2563EB" />
  </g>

  <text x="500" y="175" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#2563EB" text-anchor="middle">CERTIFICATE OF PARTICIPATION</text>
  
  <text x="500" y="215" font-family="'Inter', sans-serif" font-size="14" font-style="italic" fill="#64748B" text-anchor="middle">This is presented with appreciation to</text>

  <!-- Candidate Name -->
  <text x="500" y="280" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="700" letter-spacing="1.5" fill="#0F172A" text-anchor="middle">DHANYA BIJU</text>
  <line x1="320" y1="300" x2="680" y2="300" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />

  <!-- Workshop description -->
  <text x="500" y="340" font-family="'Inter', sans-serif" font-size="14" fill="#475569" text-anchor="middle">for active participation and completion of the professional development workshop</text>

  <text x="500" y="388" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#1D4ED8" text-anchor="middle">TALENTO Program</text>

  <!-- Competencies -->
  <text x="500" y="428" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Career Readiness • Corporate Skills • Professional Mentoring • Industry Exposure</text>

  <!-- Institution -->
  <text x="500" y="475" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#1E293B" text-anchor="middle">Enbridge</text>

  <!-- Seal and Signatures -->
  <g transform="translate(500, 560)">
    <!-- Seal -->
    <circle cx="0" cy="0" r="42" fill="url(#sealGradTalento)" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="#BFDBFE" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="0" y="5" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TALENTO</text>
    <text x="0" y="18" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="600" fill="#93C5FD" text-anchor="middle">2024</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(240, 565)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#94A3B8" stroke-width="1.5" />
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Program Lead</text>
    <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Enbridge Training Program</text>
  </g>

  <g transform="translate(760, 565)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#94A3B8" stroke-width="1.5" />
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">HR &amp; Development Head</text>
    <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Talent Development Series</text>
  </g>

  <!-- Certificate ID Footer -->
  <text x="500" y="640" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Credential ID: ENB-TALENTO-2024 • Verified Workshop Completion</text>
</svg>

